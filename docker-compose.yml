version: '3.8'

services:
  sftp:
    build: .
    container_name: sftp-server
    restart: unless-stopped
    ports:
      - "2222:22"
    environment:
      - SFTP_USER=sftp
      - SFTP_PASS=sftp
      - SFTP_UID=1000
      - SFTP_GID=1000
      - SSH_KEY=ssh-rsa  user@example.org
    volumes:
      - /mnt/sftpdata:/home/sftp

volumes:
  sftp-data:
