---
# Secret for SFTP authentication (password + multiple public keys)
apiVersion: v1
kind: Secret
metadata:
  name: sftp-secret
  namespace: sftp
type: Opaque
stringData:
  SFTP_USER: sftp
  SFTP_PASS: sftp
  # Multiple public keys - each on a new line
  # Add additional keys below (authorized_keys format: key-type base64... comment)
  authorized_keys: |
    ssh-rsa  user@example.org
    # Add more keys below:
    # ssh-ed25519 AAAA... user@other-machine
    # ssh-rsa AAAA... user@another-machine
---
# PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftp-data-pvc
  namespace: sftp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp-deployment
  namespace: sftp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sftp
  template:
    metadata:
      labels:
        app: sftp
    spec:
      containers:
        - name: sftp
          image: inkassodeppen/sftpcontainer:latest
          ports:
            - containerPort: 22
              name: sftp
          env:
            - name: SFTP_USER
              valueFrom:
                secretKeyRef:
                  name: sftp-secret
                  key: SFTP_USER
            - name: SFTP_PASS
              valueFrom:
                secretKeyRef:
                  name: sftp-secret
                  key: SFTP_PASS
            - name: SFTP_UID
              value: "1000"
            - name: SFTP_GID
              value: "1000"
            - name: SFTP_ROOT
              value: /home/sftp
            # SSH_KEY is now provided via mounted volume, not env var
          volumeMounts:
            - name: sftp-data
              mountPath: /home/sftp
            - name: ssh-keys
              mountPath: /home/sftp/.ssh
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: sftp-data
          persistentVolumeClaim:
            claimName: sftp-data-pvc
        - name: ssh-keys
          secret:
            secretName: sftp-secret
            items:
              - key: authorized_keys
                path: authorized_keys
            defaultMode: 0600
---
# Service (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: sftp-service-nodeport
  namespace: sftp
spec:
  type: NodePort
  ports:
    - port: 22
      targetPort: 22
      nodePort: 30022
      protocol: TCP
  selector:
    app: sftp
---
# Service (LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: sftp-service-loadbalancer
  namespace: sftp
spec:
  type: LoadBalancer
  ports:
    - port: 22
      targetPort: 22
      protocol: TCP
  selector:
    app: sftp
